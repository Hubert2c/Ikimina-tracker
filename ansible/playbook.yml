---
# =============================================================================
# Ikimina Tracker: configure both VMs and deploy the app.
#
#   Play 1 - bastion     : SSH hardening, fail2ban, UFW (incl. NAT forwarding
#                          for the private subnet), nginx reverse proxy
#   Play 2 - app_servers : SSH hardening, fail2ban, UFW, Docker + Compose,
#                          log in to ECR, pull the image, docker compose up -d
#
# The app VM has no public IP; Ansible reaches it through the bastion
# (ProxyJump, set in the inventory). Run from the repository root:
#   ansible-playbook -i ansible/inventory/hosts.ini ansible/playbook.yml \
#     -e image_tag=<git sha> -e registry_server=<ecr registry> \
#     -e registry_token="$(aws ecr get-login-password)" --ask-vault-pass
# The CD pipeline (.github/workflows/cd.yml) runs exactly this on every merge.
# =============================================================================

# ------------------------------------------------------------ BASTION ----
- name: Configure the bastion host (jump host and reverse proxy)
  hosts: bastion
  become: true

  vars:
    # ProxyJump needs TCP forwarding on the jump host ("local" = outbound only).
    ssh_allow_tcp_forwarding: "local"
    # Private IP of the app VM, taken from the inventory.
    app_private_ip: "{{ hostvars[groups['app_servers'][0]]['ansible_host'] }}"

  tasks:
    - name: Install nginx, UFW and fail2ban
      ansible.builtin.apt:
        name:
          - nginx
          - ufw
          - fail2ban
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Harden SSH and enable fail2ban
      ansible.builtin.import_tasks: tasks/ssh_hardening.yml

    # --- Reverse proxy: public port 80 -> app VM (private IP) port 5000 ----
    - name: Configure nginx as a reverse proxy to the app VM
      ansible.builtin.template:
        src: nginx-ikimina.conf.j2
        dest: /etc/nginx/sites-available/ikimina
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable the Ikimina site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/ikimina
        dest: /etc/nginx/sites-enabled/ikimina
        state: link
      notify: Reload nginx

    - name: Disable the default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Check the nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Start and enable nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    # --- Host firewall (second layer behind the AWS security group) ---------
    # SSH is allowed from anywhere at the host level because the security
    # group already restricts it to the admin IP (plus the CD runner during a
    # deploy, whose IP changes every run).
    - name: Deny all inbound traffic by default
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow all outbound traffic
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH and HTTP
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["22", "80"]

    # The bastion is also the NAT for the private subnet (set up at boot by
    # Terraform user data). UFW drops forwarded traffic by default, so allow
    # traffic that comes from the app subnet; replies are allowed by UFW's
    # built-in "established" rule.
    - name: Allow forwarding (NAT) for the private app subnet
      community.general.ufw:
        rule: allow
        route: true
        src: "{{ app_subnet_cidr }}"

    - name: Enable the host firewall
      community.general.ufw:
        state: enabled

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

# ------------------------------------------------------------- APP VM ----
- name: Configure the app VM and deploy the container from ECR
  hosts: app_servers
  become: true

  vars:
    ssh_allow_tcp_forwarding: "no"
    app_directory: /opt/ikimina-tracker
    image: "{{ registry_server }}/{{ image_repository }}:{{ image_tag }}"

  tasks:
    - name: Check that the deployment settings are present
      ansible.builtin.assert:
        that:
          - registry_server is defined and registry_server | length > 0
          - registry_token is defined and registry_token | length > 0
          - image_tag is defined and image_tag | length > 0
          - database_url is defined and database_url.startswith('postgresql://')
        fail_msg: >-
          Set database_url (vault), and pass -e image_tag=...
          -e registry_server=... -e registry_token=... (see ansible/README.md).
        quiet: true

    # --- Required packages ---------------------------------------------------
    - name: Install Docker, Docker Compose, UFW and fail2ban
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - ufw
          - fail2ban
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Harden SSH and enable fail2ban
      ansible.builtin.import_tasks: tasks/ssh_hardening.yml

    # --- Host firewall: only the bastion's subnet may connect ---------------
    - name: Deny all inbound traffic by default
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow all outbound traffic
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH and the API port from the bastion subnet only
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        src: "{{ bastion_subnet_cidr }}"
      loop: ["22", "{{ app_port | string }}"]

    - name: Enable the host firewall
      community.general.ufw:
        state: enabled

    # --- Deploy -----------------------------------------------------------------
    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Write the environment file (database URL and version)
      ansible.builtin.template:
        src: app.env.j2
        dest: "{{ app_directory }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Write the production Compose file
      ansible.builtin.template:
        src: docker-compose.prod.yml.j2
        dest: "{{ app_directory }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0640"

    # THE key task for serving traffic: authenticate to the private registry so
    # the VM can pull the image the pipeline just pushed. The ECR token is
    # short-lived (12 hours) and is removed again after the pull.
    - name: Log in to the private container registry (ECR)
      ansible.builtin.command:
        cmd: >-
          docker login {{ registry_server }}
          --username {{ registry_username }}
          --password-stdin
        stdin: "{{ registry_token }}"
      changed_when: false
      no_log: true

    - name: Pull the new image
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ app_directory }}"
      register: compose_pull
      changed_when: "'Pulled' in compose_pull.stderr or 'Pulled' in compose_pull.stdout"

    - name: Log out of the registry (no credentials left on the VM)
      ansible.builtin.command:
        cmd: docker logout {{ registry_server }}
      changed_when: false

    - name: Start or update the container (docker compose up -d)
      ansible.builtin.command:
        cmd: docker compose up --detach --remove-orphans
        chdir: "{{ app_directory }}"
      register: compose_up
      changed_when: >-
        'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr or
        'Created' in compose_up.stderr

    # --- Verify -----------------------------------------------------------------
    # Plain HTTP is fine here: 127.0.0.1 is the VM itself, so traffic never
    # leaves the host (accepted Checkov finding CKV2_ANSIBLE_1, see SECURITY.md).
    - name: Wait until the app is ready (database reachable)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/ready"
        status_code: 200
      register: app_ready
      retries: 24
      delay: 5
      until: app_ready.status == 200

    - name: Check that the new version is running
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/version"
        return_content: true
      register: app_version
      failed_when: app_version.json.version != image_tag

    - name: Remove old, unused images to free disk space
      ansible.builtin.command:
        cmd: docker image prune --all --force --filter "until=168h"
      register: prune
      changed_when: "'Total reclaimed space: 0B' not in prune.stdout"

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
