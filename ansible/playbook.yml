---
# Configures the Azure VM created by Terraform and deploys Ikimina Tracker.
#
#   common   - package cache, base tools, automatic security updates
#   security - UFW firewall, SSH hardening, fail2ban, kernel network hardening
#   docker   - Docker Engine + Compose plugin with a hardened daemon config
#   app      - checks out the code, writes the .env, starts the stack and
#              verifies /health (prints diagnostics and fails on error)
#
# Every task is idempotent: a second run reports "changed=0".
# Usage: see ansible/README.md

- name: Configure and deploy Ikimina Tracker
  hosts: app_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Check this is a supported OS (Ubuntu 22.04 / 24.04)
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_major_version'] | int >= 22
        fail_msg: "Only Ubuntu 22.04+ is supported, found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}."
        quiet: true

  roles:
    - role: common
      tags: [common]
    - role: security
      tags: [security]
    - role: docker
      tags: [docker]
    - role: app
      tags: [app]
