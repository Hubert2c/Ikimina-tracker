---
- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present

- name: Harden the Docker daemon configuration
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker

- name: Start and enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# Apply a changed daemon.json now, before the app role starts containers.
- name: Apply pending Docker restart
  ansible.builtin.meta: flush_handlers
