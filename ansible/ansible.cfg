# Picked up automatically when ansible-playbook is run from this directory.
[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent

[inventory]
# Lets inventory/azure_rm.yml be used as a dynamic inventory source.
enable_plugins = host_list, ini, yaml, azure.azcollection.azure_rm

[ssh_connection]
pipelining = True
