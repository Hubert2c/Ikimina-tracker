# =============================================================================
# CI pipeline for Ikimina Tracker
# Every push (except to main) and every pull request into main runs:
#   1. lint          - flake8 style/error checks       (fails on any error)
#   2. test          - pytest, in-memory AND PostgreSQL (fails if a test fails)
#   3. docker-build  - builds the image and smoke-tests the full compose stack
#   4. infrastructure - Terraform and Ansible validation
# docker-build only starts if lint and test both passed. If ANY step exits
# with an error, the job turns red and the pull request cannot be merged
# (branch protection requires these checks).
# =============================================================================

name: CI

on:
  push:
    branches-ignore:
      - main          # main only changes through reviewed, already-tested PRs
  pull_request:
    branches:
      - main

# If you push again while a run is still going, cancel the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The pipeline only needs to read the code
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"   # same version as the Dockerfile base image

jobs:
  # --------------------------------------------------------------- LINT ----
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip                      # reuse downloaded packages between runs
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8
        # flake8 exits with a non-zero code when it finds a problem,
        # which makes this step (and the whole pipeline) fail.
        run: flake8 .

  # --------------------------------------------------------------- TEST ----
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    # A real PostgreSQL started next to the job, so the database code is tested too
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ikimina
          POSTGRES_PASSWORD: ikimina
          POSTGRES_DB: ikimina_test
        ports:
          - 5432:5432
        # Wait until Postgres is ready before running the steps
        options: >-
          --health-cmd "pg_isready -U ikimina"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # With TEST_DATABASE_URL set, every test runs on memory AND on Postgres.
        # pytest exits non-zero if any test fails, failing the pipeline.
        env:
          TEST_DATABASE_URL: postgresql://ikimina:ikimina@localhost:5432/ikimina_test
        run: pytest -v

  # ------------------------------------------------------- DOCKER BUILD ----
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]        # only build an image from code that passed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        # Fails the pipeline if the Dockerfile is broken
        run: docker build --tag ikimina-tracker:${{ github.sha }} .

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Smoke test the full stack (app + database)
        # --wait blocks until every container reports "healthy" (or fails)
        run: |
          docker compose up --build --detach --wait
          curl --fail --silent http://localhost:5000/health
          # Write and read back through PostgreSQL to prove they are connected
          curl --fail --silent -X POST http://localhost:5000/groups \
               -H "Content-Type: application/json" -d '{"name":"CI Smoke Test"}'
          curl --fail --silent http://localhost:5000/groups | grep "CI Smoke Test"

      - name: Show container logs (if something failed)
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # ------------------------------------------------ INFRASTRUCTURE ----
  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform providers
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate

      - name: Set up Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.18.6
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Check Ansible playbook syntax
        run: ansible-playbook --syntax-check -i ansible/inventory/hosts.ini.example ansible/playbook.yml
